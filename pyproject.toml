[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-recommender"
version = "0.1.0"
description = "Session-based Yoochoose recommendations with Spark ALS and MMR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "mlflow>=2.12,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15",
  "pydantic>=2,<3",
  "pyspark>=3.5,<4",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["personalized_recommender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
